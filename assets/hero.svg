<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="alexeyco/skills - agent skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1021"/>
      <stop offset="55%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#33110d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7b955"/>
      <stop offset="100%" stop-color="#f4623a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b955" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f4623a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- constellation of docs -->
  <g stroke="#f7b955" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M880 90 L1010 160 L920 260 L1070 300 L1180 210"/>
    <path d="M1010 160 L1120 90"/>
    <path d="M920 260 L790 300"/>
    <path d="M880 90 L790 300"/>
  </g>
  <g fill="url(#glow)">
    <circle cx="880" cy="90" r="10"/>
    <circle cx="1010" cy="160" r="14"/>
    <circle cx="920" cy="260" r="10"/>
    <circle cx="1070" cy="300" r="12"/>
    <circle cx="1180" cy="210" r="8"/>
    <circle cx="1120" cy="90" r="8"/>
    <circle cx="790" cy="300" r="8"/>
  </g>
  <g fill="#0b1021" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <text x="1010" y="164">md</text>
    <text x="1070" y="304">md</text>
  </g>

  <!-- wordmark -->
  <text x="80" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="92" font-weight="800" fill="#fdf6ec">alexeyco<tspan fill="url(#accent)">/skills</tspan></text>

  <!-- install pill -->
  <rect x="82" y="256" rx="34" ry="34" width="560" height="66" fill="#fdf6ec" fill-opacity="0.06" stroke="url(#accent)" stroke-width="2"/>
  <text x="118" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#f7b955">$ npx skills add alexeyco/skills</text>
</svg>
